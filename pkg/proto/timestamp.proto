syntax = "proto3";
package proto;

option go_package = "github.com/mamorski/committee-sampling/pkg/proto";

// TimestampMessage represents a message in the ExAnte and ExPost protocols.
message TimestampMessage {
  // Session identifier for this protocol instance
  string session_id = 1;
  
  // The sender's verification key
  bytes verification_key = 2;
  
  // The value associated with the verification key
  bytes value = 3;
  
  // Auxiliary data
  Aux aux = 4;
  
  // Merkle path
  repeated State merkle_path = 5;
  
  // Round number
  uint32 round = 6;
  
  // Identity of the sending node
  string from = 7;
}

message State {
  repeated bytes row = 1;
}

message Aux {
  bytes PiRP = 1;
  AuxKeyMessage aux_key = 2;
}

// AuxKeyMessage represents the auxiliary key data
message AuxKeyMessage {
  // VRF output
  bytes phi_vrf = 1;
  
  // VRF proof
  bytes pi_vrf = 2;
  
  // VDF output
  bytes phi_vdf = 3;
  
  // VDF proof
  bytes pi_vdf = 4;
}
